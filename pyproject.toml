[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poly-pit-replay"
version = "0.1.0"
description = "封闭式 Polymarket→A股行业排序实验系统"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
data = ["duckdb>=1.0", "pandas>=2.0"]

[project.scripts]
poly-ashare = "poly_ashare.cli:main"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["poly_pit_replay*", "poly_ashare*", "scripts*"]
